project:
  type: default
  output-dir: .

format:
  revealjs:
    theme: [default, custom.scss]
    slide-number: true
    code-line-numbers: false
    highlight-style: github
    transition: fade
    width: 1280
    height: 720
    center: true
    hash-type: number
    navigation-mode: linear
    controls: true
    progress: true
    # Logo in bottom-right corner (add your logo to assets/)
    logo: assets/Erasmus.png
    footer: "RAIner"
