[tool.poetry]
name = "rainer"
version = "0.1.0"
description = "RAiner - An open-source research assistant for academic work"
readme = "README.md"
license = "MIT"
authors = ["Caspar David Peter <peter@rsm.nl>"]
keywords = ["research", "assistant", "rag", "academic", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "rainer"}]
include = ["rainer/prompts/*.md"]

[tool.poetry.dependencies]
python = "^3.10"
ollama = "^0.4.0"
openai = "^1.0.0"
anthropic = "^0.40.0"
google-genai = "^1.0.0"
chromadb = "^0.5.0"
posthog = ">=2.4.0,<6.0.0"  # Pin for ChromaDB telemetry compatibility
duckdb = "^1.0.0"
pyyaml = "^6.0"
rich = "^13.0.0"
prompt-toolkit = "^3.0.0"
sentence-transformers = "^3.0.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
mcp = "^1.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.5.0"

[tool.poetry.group.pdf]
optional = true

[tool.poetry.group.pdf.dependencies]
docling = "^2.15.0"
transformers = ">=4.55.0"  # Required for RT-DETRv2 model used by docling

[tool.poetry.scripts]
rainer = "rainer.cli:main"
rainer-embed = "rainer.embed:main"
rainer-mcp = "rainer.mcp_server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
